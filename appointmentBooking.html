     <!--appointment booking form-->
    <h1>Patient Bookings</h1>
    <form action="#">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="John Snow" required>

            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="eg@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+27 61 685 5391">
            </div>
            <div class="form-group">
                <label for="subject">Enquiry Type</label>
                <select id="subject" name="subject" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="preventive service">Preventive services</option>
                    <option value="cosmetic service">Cosmetic services</option>
                    <option value="restorative service">Restorative services</option>
                    <option value="consultation">Consultation</option>
                    <option value="followup">Follow up session</option>
                </select>
            
            </div>
            <div class="form-group">
                <label for="date">Select Date</label>
                <input type="date" id="date" name="date" required>

            </div>
             <!--Drop down to select time-->
            <div class="form-group">
                <label for="time">Select Time</label>
                <select id="time" name="time" required>
                    <option value="" disabled selected>Select a time</option>
                    <option value="8:00 AM">8:00 AM</option>
                    <option value="8:30 AM">8:30 AM</option>
                    <option value="9:00 AM">9:00 AM</option>
                    <option value="9:30 AM">9:30  AM</option>
                    <option value="10:00 AM">10:00 AM</option>
                    <option value="10:30 AM">10:30 AM</option>
                    <option value="11:00 AM">11:00 AM</option>
                    <option value="11:30 AM">11:30 AM</option>
                    <option value="12:00 PM">12:00 PM</option>
                    <option value="12:30 PM">12:30 PM</option>
                    <option value="13:00 PM">13:00 PM</option>
                    <option value="13:30 PM">13:30 PM</option>
                    <option value="14:00 PM">14:00 PM</option>
                    <option value="14:30 PM">14:30 PM</option>
                    <option value="15:00 PM">15:00 PM</option>
                    <option value="15:30 PM">15:30 PM</option>
                    
                </select>


            </div>
            <button type="submit">Confirm Appointment</button>

</form>
