<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings</title>
</head>
<body>
      <div id="menu">
        <a href="homePage.html">Home</a>
        <a href="aboutUs.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="enquire.html">Enquire</a>
        <a href="#">Appointment Booking</a>
        <a href="testimonials.html">Testimonials</a>

    </div>
    <form action="#">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="John Snow" required>

            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="eg@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+27 61 685 5391">
            </div>
            <div class="form-group">
                <label for="subject">Enquiry Type</label>
                <select id="subject" name="subject" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="preventive service">Preventive services</option>
                    <option value="cosmetic service">Cosmetic services</option>
                    <option value="restorative service">Restorative services</option>
                    <option value="consultation">Consultation</option>
                    <option value="followup">Follow up session</option>
                </select>
            
            </div>
            <div class="form-group">
                <label for="date">Select Date</label>
                <input type="date" id="date" name="date" required>

            </div>
            <div class="form-group">
                <label for="time">Select Time</label>
                <input type="time" id="time" name="time" required>


            </div>
            <button type="submit">Confirm Appointment</button>

</form>
    
</body>
</html>
