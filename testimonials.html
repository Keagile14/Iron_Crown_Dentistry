     <h2>Share your experience</h2>

     <p>We would love to hear about your experience with Iron Crown Dentistry</p>

     <form action="#">
        <div class="form-group">
            <label for="name">Enter name</label>
            <input type="text" id="name" name="name" placeholder="Enter name">
        </div>
        <div class="form-group">
            <label for="rating">Reviews</label>
            <select id="rating" name="rating" required>
                <option value="" disabled selected>Select a rating</option>
                <option value="5">***** <strong>5 Stars</strong></option>
                <option value="4">****<strong>4 Stars</strong></option>
                <option value="3">***<strong>3 Stars</strong></option>
                <option value="2">**<strong>2 Stars</strong></option>
                <option value="1">*<strong>1 Star</strong></option>
            </select>
        </div>
        <div class="form-group">
            <label for="testimonials">Testimonial</label>
            <textarea
            id="testimonial"
            name="testimonial"
            rows="5"
            placeholder="How was your experience?"
            required>
        </textarea>        
        </div>
        <button type="submit">Submit Review</button>
     </form>
