     <!--Enquiry form for clients-->
    <div class="enquire-page">
        <h2>Patient Enquiry</h2>
        <p>Please fill out the form, our team will get back to you</p>
        <form action="#">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="John Snow" required>

            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="eg@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+27 61 685 5391">
            </div>
             <!--Form where you can select your service-->
            <div class="form-group">
                <label for="subject">Enquiry Type</label>
                <select id="subject" name="subject" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="preventive service">Preventive services</option>
                    <option value="cosmetic service">Cosmetic services</option>
                    <option value="restorative service">Restorative services</option>
                    <option value="other">Questions</option>
                </select>
            </div>
            <div class="form-group">
                <label for="message">Enter message</label>
                <textarea id="message" name="message" placeholder="Need help?" required></textarea>
            </div>
         <button type="submit" class="submit-btn">Submit</button> 
        </form>
    </div>
     <!--Footer section with company details-->
    <footer>
    <div class="footer-container">
        <div class="footer-section">
        
        <p>Business Hours: 8am - 5pm </p>
        <p>Address: 456 Kudube Unit D, Hammanskraal, 0407</p>

        </div>
